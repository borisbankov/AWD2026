<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
        <style>
            body{ background:whitesmoke;}
        </style>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-xl-3 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <ul class="nav flex-xl-column justify-content-center justify-content-md-start">
                                <li class="nav-item">
                                    <a href="#" class="nav-link"><i class="bi bi-bar-chart"></i> Overview</a>
                                </li>
                                <li class="nav-item">
                                    <a href="#" class="nav-link"><i class="bi bi-grid-3x3-gap"></i> CRUD</a>
                                </li>
                                <li class="nav-item">
                                    <a href="#" class="nav-link"><i class="bi bi-gear"></i> Settings</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-lg-9 mb-4">
                    <div class="card">
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-12 col-md-auto">
                                    <img src="https://placehold.co/140x140" alt="">
                                </div>
                                <div class="col-12 col-md text-md-start">
                                    <div class="h3">
                                        John Smith
                                    </div>
                                    <div>
                                        @johnny.s
                                    </div>
                                    <small class="text-muted d-block">
                                        Last seen 2 hours ago
                                    </small>
                                    <a href="" class="btn btn-primary">Change photo</a>
                                </div>
                                <div class="col-12 col-md-auto text-md-end">
                                    <span class="badge text-bg-secondary">administrator</span>
                                    <div class="text-muted">Joined 05 Nov 2022</div>
                                </div>
                            </div>
                            <ul class="nav nav-tabs mt-4 mx-1">
                                <li class="nav-item">
                                    <a href="#" class="nav-link active">Settings</a>
                                </li>
                            </ul>
                            <form action="" class="p-3">
                                <div class="row">
                                    <div class="col">
                                        <label for="">Full Name</label>
                                        <input type="text" class="form-control" value="John Smith">
                                    </div>
                                    <div class="col">
                                        <label for="">Username</label>
                                        <input type="text" class="form-control" value="johnny.s">
                                    </div>
                                </div>
                                <label for="">Email</label>
                                <input type="text" class="form-control" value="user@example.com">
                                <label for="">About</label>
                                <textarea class="form-control" rows="4">My Bio</textarea>
                                <div class="row">
                                    <div class="col">
                                        <div class="mb-1 mt-2 fw-bold">
                                            Change Password
                                        </div>
                                        <label for="">Current Password</label>
                                        <input type="password" class="form-control" value="abcdefgh">
                                        <label for="">New Password</label>
                                        <input type="password" class="form-control" value="abcdefgh">
                                        <label for="">Confirm Password</label>
                                        <input type="password" class="form-control" value="abcdefgh">
                                    </div>
                                    <div class="col">
                                        <div class="mb-1 mt-2 fw-bold">
                                           Keeping in Touch
                                        </div>
                                        <div>Email Notifications</div>
                                        <div>
                                            <input type="checkbox" class="form-check-input">
                                            <label for="">Blog posts</label>
                                        </div>
                                        <div>
                                            <input type="checkbox" class="form-check-input">
                                            <label for="">Newsletter</label>
                                        </div>
                                        <div>
                                            <input type="checkbox" class="form-check-input">
                                            <label for="">Personal offers</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-start text-md-end mt-4">
                                    <button type="submit" class="btn btn-primary"> 
                                        <i class="bi bi-check-circle-fill"></i> Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card mb-4">
                        <div class="card-body d-grid">
                            <a href="#" class="btn btn-secondary"> <i class="bi bi-arrow-right-square-fill"></i> Logout</a>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-1 fw-bold">
                               Support
                            </div>
                            <div class="mb-3">Get fast, free help from our friendly assistants</div>
                            <a href="#" class="btn btn-primary">Contact us</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>                                                              
        
    </body>
</html>
