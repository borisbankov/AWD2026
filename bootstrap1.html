<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <div class="row">
       <div class="col-xl-6 col-lg-3 col-md-3 bg-primary border border-dark">1</div>
       <div class="col-xl-6 col-lg-3 col-md-6 bg-primary border border-dark">2</div>
      </div>
      <div class="row">
        <div class="col-xl-12 col-lg-9 col-md-6 bg-warning border border-dark">3</div>
      </div>
      <div class="row justify-content-end align-items-center" style="height: 500px">
        <div class="col-xl-3 col-lg-6 col-md-3 bg-success border border-dark">4</div>
        <div class="col-xl-3 col-lg-6 col-md-3 bg-success border border-dark">5</div>
        <div class="col-xl-3 col-lg-12 col-md-3 bg-success border border-dark">6</div>
      </div>
      <div class="row">
       <div class="col-xl-9 col-lg-3 col-md-6 bg-danger border border-dark">7</div>
       <div class="col-xl-3 col-lg-9 col-md-6 bg-danger border border-dark">8</div>
      </div>
    </div>

</html>
