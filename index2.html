<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		.box-1, .box-2{
			background: orange;
		}
		.box-3{
			background: yellow;
		}
		.box-4, .box-5, .box-6{
			background: blue;
		}
		.box-7, .box-8, .box-9, .box-10{
			background: #c3c3c3;
		}

		@media screen and (min-width: 768px){
			.box-7, .box-8, .box-9, .box-10{
				width: calc(50% - 2px);
				display: inline-block;
			}
		}

		@media screen and (min-width: 1024px){
			.box-1, .box-2{
				width: calc(50% - 2px);
				display: inline-block;
			}
			.box-4, .box-5, .box-6{
				width: calc(33.36% - 3px);
				display: inline-block;
			}
			.box-7, .box-8, .box-9, .box-10{
				width: calc(25% - 3px);
				display: inline-block;
			}
		}
	</style>
</head>
<body>
	
	<div class="box-1">Div 1</div>
	<div class="box-2">Div 2</div>
	<div class="box-3">Div 3</div>
	<div class="box-4">Div 4</div>
	<div class="box-5">Div 5</div>
	<div class="box-6">Div 6</div>
	<div class="box-7">Div 7</div>
	<div class="box-8">Div 8</div>
	<div class="box-9">Div 9</div>
	<div class="box-10">Div 10</div>


</body>
</html>
