<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col text-center">
          <h1>Вход в системата</h1>
        </div>
      </div>
      <div class="row my-5">
        <div class="col-sm-6 pe-3">
          <label for="" class="form-label">Имейл</label> 
          <!-- form label добавя малко отстояние отдолу (margin)  -->
          <input type="text" class="form-control" placeholder="Text">
          <!-- form-control добавя широчина, padding, border, и т.н. -->
        </div>
        <div class="col-sm-6 ps-3">
          <label for="" class="form-label">Парола</label> 
          <!-- form label добавя малко отстояние отдолу (margin)  -->
          <input type="text" class="form-control" placeholder="Text">
          <!-- form-control добавя широчина, padding, border, и т.н. -->
        </div>
      </div>
      <div class="row text-center justify-content-center">
        <div class="col-sm-4">
          <input type="checkbox">
          <label for="">Не ме отписвай автоматично</label>
        </div>
        <div class="col-sm-4 d-grid mt-5 order-sm-4">
          <input type="submit" class="btn btn-primary">
        </div>
        <div class="col-sm-4">
          <a href="">Нямате профил? Регистрирайте се</a>
        </div>
        <div class="col-sm-4">
          <a href="">Забравена парола</a>
        </div>
        
      </div>
    </div>
  </body>
</html>
